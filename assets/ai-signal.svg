<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Animated AI signal">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#0d1f3a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" rx="16" fill="url(#bg)"/>

  <path fill="none" stroke="url(#wave)" stroke-width="3.5" filter="url(#glow)">
    <animate attributeName="d" dur="5.4s" repeatCount="indefinite"
      values="
        M0 102 C120 72,240 132,360 102 C480 72,600 132,720 102 C840 72,960 132,1080 102 C1140 86,1170 98,1200 102;
        M0 94 C120 122,240 66,360 94 C480 122,600 66,720 94 C840 122,960 66,1080 94 C1140 110,1170 98,1200 94;
        M0 102 C120 72,240 132,360 102 C480 72,600 132,720 102 C840 72,960 132,1080 102 C1140 86,1170 98,1200 102" />
  </path>

  <g fill="#38bdf8" opacity="0.8" filter="url(#glow)">
    <circle cx="160" cy="56" r="3">
      <animate attributeName="cy" values="56;124;56" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="124" r="3">
      <animate attributeName="cy" values="124;52;124" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="60" r="3">
      <animate attributeName="cy" values="60;126;60" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="126" r="3">
      <animate attributeName="cy" values="126;58;126" dur="4.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="64" r="3">
      <animate attributeName="cy" values="64;122;64" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#60a5fa" opacity="0.75">
    <rect x="70" y="132" width="10" height="20" rx="2">
      <animate attributeName="height" values="20;42;16;34;20" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="132;110;136;118;132" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="126" width="10" height="26" rx="2">
      <animate attributeName="height" values="26;18;40;24;26" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="126;134;112;128;126" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1114" y="130" width="10" height="22" rx="2">
      <animate attributeName="height" values="22;38;16;30;22" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="130;114;136;122;130" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1136" y="124" width="10" height="28" rx="2">
      <animate attributeName="height" values="28;20;36;18;28" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="124;132;116;134;124" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
